name: Collect Nostr replies

# Watches the public relays for replies, reposts and reactions to our notes and
# files anything new as a GitHub issue — so a reaction is never missed, however
# long nobody is looking.
#
# Needs no secret: the npub is public and GITHUB_TOKEN is provided automatically.

on:
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: nostr-inbox
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm init -y >/dev/null 2>&1 && npm install nostr-tools ws >/dev/null 2>&1

      - name: Collect interactions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/inbox-nostr.mjs

      - name: Commit inbox ledger
        run: |
          if [[ -n "$(git status --porcelain content/inbox-state.json)" ]]; then
            git config user.name "Nirodha Collective"
            git config user.email "285060945+Mycelorium@users.noreply.github.com"
            git add content/inbox-state.json
            git commit -m "chore: update Nostr inbox ledger"
            git push
          else
            echo "No inbox change."
          fi
