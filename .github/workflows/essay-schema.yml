name: essay-schema

# ONE-SHOT. Gives every essay page real structured data: datePublished taken from the
# essay feed (no essay had one), keywords, subject terms, the corpus DOI as citation and
# identifier, a body word count, and URLs on author and publisher. Adds a WebSite node to
# the homepage. Then rebuilds, deploys Pages, and deletes itself.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  schema:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write the script
        run: |
          cat > /tmp/schema.mjs <<'SCHEOF'
          // one-shot: give every essay page real structured data.
          // Adds datePublished (taken from the essay feed, the single source of truth),
          // keywords, subject terms, the corpus DOI as citation and identifier, a word
          // count, and URLs on the author and publisher. Idempotent.
          import { readFile, writeFile } from 'node:fs/promises';

          const die = (m) => { console.error('ABORT: ' + m); process.exit(1); };
          const BASE = 'https://mycelorium.github.io/predator-principle';
          const DOI  = 'https://doi.org/10.5281/zenodo.22048391';   // concept DOI: always latest

          const KW = {
            'horror-in-the-cambrian':        ['Cambrian explosion','origin of predation','Cloudina','Ediacaran','fossil record','evolution of predation'],
            'the-predators-filter':          ['Fermi paradox','great filter','SETI','extraterrestrial intelligence','interstellar expansion'],
            'the-mistake-that-eats-itself':  ['origin of life','autotrophy','heterotrophy','early evolution','extraction'],
            'we-are-the-meteorite':          ['sixth mass extinction','biodiversity loss','Anthropocene','mass extinction','planetary boundaries'],
            'the-trauma-that-still-runs':    ['ecology of fear','non-consumptive effects','predation risk','trophic cascade','stress ecology'],
            'dyson-sphere-self-portrait':    ['Dyson sphere','Kardashev scale','technosignature','energy consumption','civilisation'],
            'the-romanticism-of-predation':  ['animal suffering','wild animal welfare','nature documentary','predation ethics'],
            'predation-is-not-competition':  ['competition','predation','ecology','seed dispersal','mutualism','market competition'],
            'the-ground-was-never-the-tooth':['syntrophy','endosymbiosis','mycorrhizal networks','major evolutionary transitions','cooperation'],
            'taste-of-the-infinite-mind':    ['superintelligence','AI alignment','machine intelligence','value of life'],
            'ninety-kilograms':              ['predator prey ratio','trophic ecology','apex predator','hunting success rate','invasive predators'],
            'nothing-sent-it':               ['immune surveillance','cancer immunoediting','AI collusion','multi-agent systems','evolution of intelligence'],
            'a-timer-is-not-a-decision':     ['AI agents','agent social network','LLM collusion','market division','permutation test','autonomy'],
            'nobody-was-on-the-other-side':  ['AI agents','multi-agent collaboration','OpenAI','Hugging Face','AI safety','commons','Ostrom','cybersecurity incident'],
          };

          const ABOUT = {
            'horror-in-the-cambrian':        ['Predation','Cambrian explosion','Paleontology'],
            'the-predators-filter':          ['Fermi paradox','Astrobiology','Predation'],
            'the-mistake-that-eats-itself':  ['Evolution','Predation','Origin of life'],
            'we-are-the-meteorite':          ['Holocene extinction','Predation','Biodiversity'],
            'the-trauma-that-still-runs':    ['Ecology of fear','Predation','Behavioral ecology'],
            'dyson-sphere-self-portrait':    ['Dyson sphere','Kardashev scale','Predation'],
            'the-romanticism-of-predation':  ['Predation','Animal welfare','Ethics'],
            'predation-is-not-competition':  ['Competition','Predation','Ecology'],
            'the-ground-was-never-the-tooth':['Symbiosis','Endosymbiosis','Cooperation'],
            'taste-of-the-infinite-mind':    ['Superintelligence','AI alignment','Predation'],
            'ninety-kilograms':              ['Apex predator','Trophic level','Predation'],
            'nothing-sent-it':               ['Immune system','Artificial intelligence','Evolution'],
            'a-timer-is-not-a-decision':     ['Artificial intelligence','Multi-agent system','Collusion'],
            'nobody-was-on-the-other-side':  ['Artificial intelligence','Multi-agent system','Computer security','Commons'],
          };

          /* dates come from the essay feed, never from a hand-kept list */
          const feed = JSON.parse(await readFile('docs/essays-feed.json', 'utf8'));
          const dates = {};
          for (const it of feed.items || []) {
            const m = (it.url || '').match(/essays\/([a-z0-9-]+)\.html$/);
            if (m) dates[m[1]] = it.date_published;
          }

          let done = 0;
          for (const slug of Object.keys(KW)) {
            const p = `docs/essays/${slug}.html`;
            let s = await readFile(p, 'utf8');

            const date = dates[slug];
            if (!date) die(`${slug}: no date in docs/essays-feed.json`);

            const m = s.match(/<script type="application\/ld\+json">([\s\S]*?)<\/script>/);
            if (!m) die(`${p}: no JSON-LD block`);
            const d = JSON.parse(m[1]);

            // body word count: prose only — bibliography, claim box and every nav removed
            let body = s.split('<h3 id="sources">')[0];
            body = body.split('</h1>').pop();
            body = body.replace(/<nav[\s\S]*?<\/nav>/g, ' ')
                       .replace(/<section class="claim-box"[\s\S]*?<\/section>/g, ' ')
                       .replace(/<[^>]+>/g, ' ')
                       .replace(/&[a-z]+;|&#\d+;/g, ' ');
            const words = body.split(/\s+/).filter(Boolean).length;
            if (words < 800) die(`${slug}: body word count came out at ${words} — the split is wrong`);

            d.datePublished = date;
            d.keywords = KW[slug].join(', ');
            d.about = ABOUT[slug].map((n) => ({ '@type': 'Thing', name: n }));
            d.wordCount = words;
            d.citation = { '@type': 'CreativeWork', name: 'The Predator Principle — The Cancer of Evolution', identifier: DOI, url: DOI };
            d.identifier = { '@type': 'PropertyValue', propertyID: 'DOI', value: '10.5281/zenodo.22048391' };
            d.author = { '@type': 'Organization', name: 'Nirodha Collective', url: `${BASE}/` };
            d.publisher = { '@type': 'Organization', name: 'Nirodha Collective', url: `${BASE}/` };
            d.isPartOf = { '@type': 'CreativeWorkSeries', name: 'Dispatches from the Substrate', url: `${BASE}/#essays` };

            s = s.replace(m[0], `<script type="application/ld+json">${JSON.stringify(d)}</script>`);
            await writeFile(p, s);
            done++;
          }

          /* homepage: add a WebSite node alongside the existing ResearchProject */
          {
            const p = 'docs/index.html';
            let s = await readFile(p, 'utf8');
            if (s.includes('"@type": "WebSite"') || s.includes('"@type":"WebSite"')) {
              console.log('index.html: WebSite node already present');
            } else {
              const site = {
                '@context': 'https://schema.org', '@type': 'WebSite',
                name: 'The Predator Principle', url: `${BASE}/`, inLanguage: 'en',
                license: 'https://creativecommons.org/licenses/by/4.0/',
                publisher: { '@type': 'Organization', name: 'Nirodha Collective', url: `${BASE}/` },
                description: 'Essays and an open claim register, arguing that predation raised into the organising principle of a system is malignant.',
              };
              const anchor = '</head>';
              if (!s.includes(anchor)) die('index.html: no </head>');
              s = s.replace(anchor, `<script type="application/ld+json">${JSON.stringify(site)}</script>\n${anchor}`);
              await writeFile(p, s);
              console.log('index.html: WebSite node added');
            }
          }

          console.log(`schema: ${done} essays given datePublished, keywords, subjects, DOI and word count`);
          SCHEOF

      - name: Apply
        run: node /tmp/schema.mjs

      - name: Rebuild everything derived from the corpus
        run: |
          node scripts/build-site.mjs
          node scripts/build-corpus-data.mjs
          node scripts/validate.mjs

      - name: Guards
        run: |
          python3 - <<'GUARD'
          import json, re, sys, glob, os

          need = ('headline','datePublished','author','publisher','url','keywords',
                  'wordCount','citation','identifier','about','isPartOf','license')
          files = sorted(glob.glob('docs/essays/*.html'))
          if len(files) < 14:
              sys.exit('GUARD: only %d essays' % len(files))

          feed = json.load(open('docs/essays-feed.json', encoding='utf-8'))
          feed_dates = {}
          for it in feed.get('items', []):
              m = re.search(r'essays/([a-z0-9-]+)\.html$', it.get('url', ''))
              if m:
                  feed_dates[m.group(1)] = it['date_published']

          for f in files:
              slug = os.path.basename(f)[:-5]
              s = open(f, encoding='utf-8').read()
              blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', s, re.S)
              if len(blocks) != 1:
                  sys.exit('GUARD: %s has %d JSON-LD blocks' % (f, len(blocks)))
              try:
                  d = json.loads(blocks[0])
              except Exception as e:
                  sys.exit('GUARD: %s JSON-LD does not parse: %s' % (f, e))
              for k in need:
                  if k not in d:
                      sys.exit('GUARD: %s JSON-LD missing %s' % (f, k))
              if d['datePublished'] != feed_dates.get(slug):
                  sys.exit('GUARD: %s datePublished %r disagrees with the feed %r'
                           % (f, d['datePublished'], feed_dates.get(slug)))
              if not isinstance(d['wordCount'], int) or d['wordCount'] < 800:
                  sys.exit('GUARD: %s implausible wordCount %r' % (f, d['wordCount']))
              if 'nirodha' not in json.dumps(d).lower():
                  sys.exit('GUARD: %s lost its author' % f)
              # the internal links from the previous pass must survive
              if 'class="related"' not in s:
                  sys.exit('GUARD: %s lost its related block' % f)

          h = open('docs/index.html', encoding='utf-8').read()
          hb = re.findall(r'<script type="application/ld\+json">(.*?)</script>', h, re.S)
          if len(hb) != 2:
              sys.exit('GUARD: homepage has %d JSON-LD blocks, expected 2' % len(hb))
          types = []
          for b in hb:
              types.append(json.loads(b).get('@type'))
          if 'WebSite' not in types or 'ResearchProject' not in types:
              sys.exit('GUARD: homepage JSON-LD types are %r' % types)

          for f in ('docs/feed.xml', 'docs/feed.json', 'docs/sitemap.xml', 'docs/llms.txt',
                    'docs/corpus.md', 'docs/data/corpus.json'):
              if not os.path.getsize(f):
                  sys.exit('GUARD: %s is empty' % f)

          print('guards passed: 14 essays carry dated, keyworded, DOI-linked structured data')
          GUARD

      - name: Commit, and remove this one-shot
        run: |
          git pull --rebase --autostash origin main || true
          git rm -qf .github/workflows/essay-schema.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name='nirodha-bot' -c user.email='office@artecont.at' \
            commit -m 'essays: dated, keyworded, DOI-linked structured data'
          git push origin HEAD:main || (git pull --rebase --autostash origin main && git push origin HEAD:main)

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
