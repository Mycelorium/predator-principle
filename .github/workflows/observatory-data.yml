name: Observatory data

# Fetches every instrument reading from its source and commits
# docs/data/observatory.json. A source that fails is recorded as failed —
# the run stays green and the page says which reading is missing.

on:
  schedule:
    - cron: "23 5 * * 1"      # Mondays, early
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/observatory-data.mjs"
      - ".github/workflows/observatory-data.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  fetch:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch instrument readings
        env:
          IUCN_TOKEN: ${{ secrets.IUCN_TOKEN }}
        run: node scripts/observatory-data.mjs

      - name: Rebuild feeds and validate
        run: |
          node scripts/build-site.mjs
          node scripts/validate.mjs

      - name: Commit readings
        run: |
          git config user.name "Nirodha Collective"
          git config user.email "285060945+Mycelorium@users.noreply.github.com"
          git add docs/data/observatory.json docs/feed.xml docs/feed.json docs/sitemap.xml docs/llms.txt
          if git diff --cached --quiet; then
            echo "No change in the readings."
          else
            git pull --rebase --autostash origin main || true
            git commit -m "observatory: refresh instrument readings"
            git push
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
