name: Tidy metadata and archive the German drafts

# One-shot maintenance job. Run it once; it deletes itself.
#
# Three things are wrong in the repository and none of them is visible on the site:
#
# 1. .zenodo.json — the text that would be attached to a DOI — still says the complex
#    cell is "two bacteria" (it is an archaeon and a bacterium, Spang et al. 2015) and
#    still describes the E/I/P classification system that was removed on 2026-08-20.
#    A DOI cannot be withdrawn, only superseded, so this must be right BEFORE any release.
# 2. docs/share.html, corpus/, editorial/ and narrative/ still carry the same removed
#    system in prose, including one served page.
# 3. essays/essay-01..09*.md are GERMAN drafts from before the English-only decision of
#    2026-08-02, marked `status: draft-for-review`, contradicting the published essays.
#    They move into essays/archive/de-2026-07/ where the project already keeps superseded
#    drafts. Nothing reads them; only the README referred to them.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply the edits
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys

          def rep(path, pairs):
              p = pathlib.Path(path)
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in s:
                      sys.exit(f"GUARD: {path} does not contain {old[:70]!r} — refusing.")
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
              print("edited", path)

          rep('.zenodo.json', [
            ("the complex cell is two bacteria that stopped devouring each other.",
             "the complex cell is an archaeon and a bacterium that stopped devouring each other."),
            ("Every claim in this corpus carries its evidence status — E for empirical evidence, I for interpretation, P for a proposition still to be tested — together with its boundary. This release contains the essay corpus, the claim and source registers as machine-readable JSON, the published dispatches, and the automation that keeps them in sync.",
             "Every factual statement in this corpus is traced to a named source. Every claim in the open register carries its boundary and the conditions that would falsify it, and each one can be taken further or contested through a public form. This release contains the essay corpus, the claim and source registers as machine-readable JSON, and the automation that keeps them in sync."),
          ])
          json.loads(pathlib.Path('.zenodo.json').read_text(encoding='utf-8'))
          print("zenodo json still parses")

          rep('docs/share.html', [
            ("'Full piece, with sources and the claim status: ' + item.url",
             "'Full piece, with its sources: ' + item.url"),
            ("'This is published as a falsifiable systems hypothesis, not as settled fact — every claim on the site carries its evidence status (E empirical / I interpretation / P proposition) and its own falsifier. Counterevidence is genuinely wanted; the strongest objection is published alongside the thesis.'",
             "'Every factual statement is traced to a named source. Every claim in the open register carries its boundary and what would falsify it, and each one has a form for submitting work that takes it further — or that breaks it.'"),
          ])

          rep('corpus/the-two-forces.md', [
            ("boldly; every factual claim keeps its evidence status (E empirical, I\ninterpretation, P proposition) and its falsifier. Boldness is not overclaiming.*",
             "boldly; every factual claim is traced to a named source and keeps its boundary\nand its falsifier. Boldness is not overclaiming.*"),
          ])

          rep('editorial/channel-style-guide.md', [
            ("Lead with the concrete claim, then the evidence status, boundary, and invitation\nto test it.",
             "Lead with the concrete claim, then its boundary and the invitation to take it\nfurther. No status letters and no classification of any kind."),
          ])

          rep('narrative/README.md', [
            ("3. **Evidence status** — linked `E`, `I`, and `P` claims; no narrative sentence\n   may be presented as empirical evidence.",
             "3. **Sources** — link the claims the scene rests on; no narrative sentence may\n   be presented as empirical evidence."),
          ])

          rep('narrative/excerpt-template.md', [
            ("## Evidence status\n\n- Evidence:\n- Interpretation:\n- To be tested:",
             "## Sources\n\n- Claims this scene rests on:\n- Where the claim stops:\n- What is not yet settled:"),
          ])

          rep('CITATION.cff', [
            ('version: 0.4.0\ndate-released: 2026-08-02',
             'version: 0.5.0\ndate-released: 2026-08-21'),
          ])

          rep('README.md', [
            ("    essays/      the essay sources\n",
             "    essays/      drafting workspace and the archive of superseded drafts\n"),
          ])

          # --- archive the German drafts ---
          german = sorted(p for p in pathlib.Path('essays').glob('essay-0*.md'))
          if not german:
              sys.exit("GUARD: no essays/essay-0*.md found — refusing.")
          dest = pathlib.Path('essays/archive/de-2026-07')
          dest.mkdir(parents=True, exist_ok=True)
          moved = []
          for p in german:
              text = p.read_text(encoding='utf-8')
              if 'status: draft-for-review' not in text:
                  sys.exit(f"GUARD: {p} is not marked draft-for-review — refusing to move it.")
              subprocess.run(['git', 'mv', str(p), str(dest / p.name)], check=True)
              moved.append(p.name)
          print("moved", len(moved), "drafts:", ", ".join(moved))

          note = dest / 'README.md'
          note.write_text(
            "# German drafts, July 2026\n\n"
            "These are the original German drafts of essays 1-9, written before the\n"
            "English-only decision of 2026-08-02. Every one is marked\n"
            "`status: draft-for-review` and carries the E/I/P classification system that\n"
            "was removed from the project on 2026-08-20.\n\n"
            "**They are history, not sources.** The essays as published are in\n"
            "`docs/essays/`, and that is the only version that is maintained. Nothing in\n"
            "the build reads this directory.\n", encoding='utf-8')
          print("wrote", note)
          PY

      - name: Delete this workflow
        run: git rm -qf .github/workflows/tidy-metadata.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main || git rebase --abort
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "Tidy: fix the Zenodo text before it gets a DOI, archive the German drafts"
          git push origin HEAD:main
