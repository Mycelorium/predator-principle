name: publish-essay-14

# ONE-SHOT. Carries the essay "Nobody Was on the Other Side" (gzip+base64, checked
# against its sha256), wires it into the homepage, both essay feeds and the claim
# and source registers, regenerates everything derived from them, deploys Pages,
# and deletes itself in the same commit.

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

