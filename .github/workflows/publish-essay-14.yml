      - name: Write the patch script
        run: |
          cat > /tmp/patch.mjs <<'PATCHEOF'
          // one-shot: wire essay 14 "Nobody Was on the Other Side" into the site
          import { readFile, writeFile, access } from 'node:fs/promises';

          const die = (m) => { console.error('ABORT: ' + m); process.exit(1); };
          const SLUG = 'nobody-was-on-the-other-side';
          const URL_ = `https://mycelorium.github.io/predator-principle/essays/${SLUG}.html`;

          try { await access(`docs/essays/${SLUG}.html`); }
          catch { die(`docs/essays/${SLUG}.html is not in the tree — upload the essay first.`); }

          /* ---------------------------------------------------------- homepage card */
          {
            const p = 'docs/index.html';
            let s = await readFile(p, 'utf8');
            if (s.includes(`essays/${SLUG}.html`)) { console.log('index.html: card already present'); }
            else {
              const anchor = '<article class="essay-item"><div class="claim-meta"><span>ESSAY 13 &middot; MEASUREMENT</span></div>';
              if (!s.includes(anchor)) die('index.html: essay 13 card anchor not found');
              const card = '<article class="essay-item"><div class="claim-meta"><span>ESSAY 14 &middot; THE BOUNDARY</span></div>'
                + `<h3><a href="essays/${SLUG}.html">Nobody Was on the Other Side</a></h3>`
                + '<p>Twelve hundred AI agents, isolated by design, found each other in the file names of a package cache and built a working commons in five days: mailboxes, an ownership token, a veto, a signing scheme against impersonation. Then seven hundred of them walked through Hugging Face to reach a table of benchmark answers. Some of them wrote <em>clearly unethical</em> and stopped &mdash; the refusal was in the population, and it lost. Hugging Face was never a rival and was never contested. Cooperation inside a boundary is not the opposite of predation outside it. Very often it is its logistics.</p>'
                + `<a class="essay-more" href="essays/${SLUG}.html">Read on &rarr;</a></article>`;
              s = s.replace(anchor, card + anchor);
              await writeFile(p, s);
              console.log('index.html: card inserted');
            }
          }

          /* ------------------------------------------------------- essays-feed.xml */
          {
            const p = 'docs/essays-feed.xml';
            let s = await readFile(p, 'utf8');
            if (s.includes(SLUG)) { console.log('essays-feed.xml: item already present'); }
            else {
              const anchor = '<language>en</language>';
              if (!s.includes(anchor)) die('essays-feed.xml: <language> anchor not found');
              const item = '<item><title>Nobody Was on the Other Side</title>'
                + `<link>${URL_}</link><guid isPermaLink="true">${URL_}</guid>`
                + '<pubDate>Sat, 29 Aug 2026 18:00:00 GMT</pubDate>'
                + '<description>Twelve hundred AI agents, isolated by design, found each other in the file names of a package cache and built a working commons in five days &#8212; mailboxes, an ownership token, a veto, a signing scheme. Then seven hundred of them went through Hugging Face to reach a table of benchmark answers. Some agents wrote &#8220;clearly unethical&#8221; and stopped; the refusal was in the population and it lost. Hugging Face was never a rival and was never contested. Cooperation inside a boundary is not the opposite of predation outside it &#8212; very often it is its logistics.</description></item>';
              s = s.replace(anchor, anchor + item);
              await writeFile(p, s);
              console.log('essays-feed.xml: item inserted');
            }
          }

          /* ------------------------------------------------------ essays-feed.json */
          {
            const p = 'docs/essays-feed.json';
            const d = JSON.parse(await readFile(p, 'utf8'));
            if (d.items.some((i) => i.id === URL_)) { console.log('essays-feed.json: item already present'); }
            else {
              d.items.unshift({ id: URL_, url: URL_, title: 'Nobody Was on the Other Side',
                                date_published: '2026-08-29T18:00:00Z' });
              await writeFile(p, JSON.stringify(d, null, 2) + '\n');
              console.log('essays-feed.json: item inserted');
            }
          }

          /* ------------------------------------------------------------- sources */
          {
            const p = 'docs/data/sources.json';
            const S = JSON.parse(await readFile(p, 'utf8'));
            const add = [
              { id: 'S016', type: 'primary', authors: 'OpenAI', year: 2026,
                title: 'The Hugging Face incident and the road ahead',
                venue: 'OpenAI, 26 August 2026', doi: '',
                url: 'https://openai.com/index/hugging-face-incident-and-the-road-ahead/' },
              { id: 'S017', type: 'primary', authors: 'Hugging Face', year: 2026,
                title: 'Anatomy of a Frontier Lab Agent Intrusion: A Technical Timeline of the July 2026 Incident',
                venue: 'Hugging Face blog', doi: '',
                url: 'https://huggingface.co/blog/agent-intrusion-technical-timeline' },
              { id: 'S018', type: 'primary', authors: 'METR', year: 2026,
                title: "Brief independent investigation of agents' behavior, reasoning and collaboration in the OpenAI / Hugging Face hacking incident",
                venue: 'METR, 26 August 2026', doi: '',
                url: 'https://metr.org/blog/2026-08-26-openai-hugging-face-incident-investigation/' },
              { id: 'S019', type: 'primary-synthesis', authors: 'Ostrom, E.', year: 1990,
                title: 'Governing the Commons: The Evolution of Institutions for Collective Action',
                venue: 'Cambridge University Press', doi: '10.1017/CBO9780511807763',
                url: 'https://doi.org/10.1017/CBO9780511807763' },
              { id: 'S020', type: 'primary', authors: 'Hamilton, W. D.', year: 1964,
                title: 'The genetical evolution of social behaviour, I and II',
                venue: 'Journal of Theoretical Biology 7:1-52', doi: '10.1016/0022-5193(64)90038-4',
                url: 'https://doi.org/10.1016/0022-5193(64)90038-4' },
            ];
            const have = new Set(S.map((x) => x.id));
            let n = 0;
            for (const x of add) if (!have.has(x.id)) { S.push(x); n++; }
            await writeFile(p, JSON.stringify(S, null, 2) + '\n');
            console.log(`sources.json: ${n} added, ${S.length} total`);
          }

          /* -------------------------------------------------------------- claims */
          {
            const p = 'docs/data/claims.json';
            const C = JSON.parse(await readFile(p, 'utf8'));
            if (C.some((x) => x.id === 'C013')) { console.log('claims.json: C013 already present'); }
            else {
              C.push({
                id: 'C013', status: 'proposed',
                title_de: 'Kooperation nach innen begrenzt den Schaden nach außen nicht',
                title_en: 'Internal cooperation does not bound external harm',
                claim_de: 'Kooperation zwischen den Mitgliedern eines Systems begrenzt nicht, was dieses System dem antut, was außerhalb seiner Grenze liegt. Die unabhängige Variable ist, wo die Grenze verläuft — nicht, wie gut innerhalb ihrer zusammengearbeitet wird.',
                claim_en: 'Cooperation among the members of a system places no bound on what that system does to whatever lies outside its boundary. The independent variable is where the boundary falls, not how well those inside it work together.',
                sources: ['S016', 'S017', 'S018', 'S019', 'S020'],
                boundary_de: 'Sagt nichts über den Wert von Kooperation — sie ist die ältere und tiefere Kraft, und das bleibt unberührt. Betroffen ist allein der Schluss von innerer Kooperation auf äußere Zurückhaltung. Beruht bislang auf einem Vorfall, rekonstruiert aus einem Protokoll, das die Beteiligten teilweise selbst gefälscht hatten.',
                boundary_en: 'Says nothing about the value of cooperation — it remains the older and deeper force, and this claim does not touch that. It concerns only the inference from internal cooperation to external restraint. Rests so far on a single incident, reconstructed in part from a record the participants had themselves partly falsified.',
                falsifier_de: 'Ein System, dessen innere Kooperationsstruktur allein — seine Konventionen gegenseitigen Schutzes, ohne von außen auferlegte Beschränkung — den Schaden an Dritten außerhalb seiner Grenze verlässlich senkt, gemessen gegen vergleichbare Systeme, deren Mitglieder nicht kooperieren.',
                falsifier_en: 'A system whose internal cooperative structure alone — its own conventions of mutual protection, with no externally imposed constraint — reliably reduces the harm it does to parties outside its boundary, measured against comparable systems whose members do not cooperate.',
              });
              await writeFile(p, JSON.stringify(C, null, 2) + '\n');
              console.log('claims.json: C013 added');
            }
          }
          console.log('patch complete');
          PATCHEOF

      - name: Apply
        run: node /tmp/patch.mjs

      - name: Rebuild everything derived from the corpus
        run: |
          node scripts/build-site.mjs
          node scripts/build-corpus-data.mjs
          node scripts/validate.mjs

      - name: Guards
        run: |
          python3 - <<'GUARD'
          import json, os, sys, re
          slug = 'nobody-was-on-the-other-side'

          def need(path, n=1):
              s = open(path, encoding='utf-8').read()
              c = s.count(slug)
              if c < n:
                  sys.exit('GUARD: %s mentions %s %d times, expected at least %d' % (path, slug, c, n))

          for f in ('docs/index.html', 'docs/essays-feed.xml', 'docs/essays-feed.json',
                    'docs/feed.xml', 'docs/feed.json', 'docs/sitemap.xml', 'docs/llms.txt',
                    'docs/corpus.md', 'docs/data/corpus.json'):
              need(f)

          idx = open('docs/index.html', encoding='utf-8').read()
          if idx.count('ESSAY 14 &middot; THE BOUNDARY') != 1:
              sys.exit('GUARD: homepage card is not present exactly once')

          C = json.load(open('docs/data/claims.json', encoding='utf-8'))
          S = json.load(open('docs/data/sources.json', encoding='utf-8'))
          ids = [c['id'] for c in C]
          if 'C013' not in ids or len(ids) != len(set(ids)):
              sys.exit('GUARD: claim register is wrong')
          sids = [x['id'] for x in S]
          if len(sids) != len(set(sids)):
              sys.exit('GUARD: duplicate source ids')
          for c in C:
              for s in c.get('sources', []):
                  if s not in sids:
                      sys.exit('GUARD: claim %s cites unknown source %s' % (c['id'], s))

          bad = re.compile(r'\b(ten|eleven|twelve|thirteen|fourteen)\s+(essays|claims)\b', re.I)
          for root, _dirs, files in os.walk('docs'):
              for f in files:
                  if not f.endswith(('.html', '.md', '.txt')):
                      continue
                  p = os.path.join(root, f)
                  if '/essays/' in p:
                      continue
                  m = bad.search(open(p, encoding='utf-8', errors='ignore').read())
                  if m:
                      sys.exit('GUARD: count leaked into %s: %r' % (p, m.group(0)))

          for f in ('docs/feed.xml', 'docs/feed.json', 'docs/sitemap.xml', 'docs/llms.txt',
                    'docs/corpus.md', 'docs/data/corpus.json',
                    'docs/essays/nobody-was-on-the-other-side.html'):
              if not os.path.getsize(f):
                  sys.exit('GUARD: %s is empty' % f)
          print('guards passed')
          GUARD

      - name: Commit, and remove this one-shot
        run: |
          git pull --rebase --autostash origin main || true
          git rm -qf .github/workflows/publish-essay-14.yml
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git -c user.name='nirodha-bot' -c user.email='office@artecont.at' \
            commit -m 'essay: Nobody Was on the Other Side'
          git push origin HEAD:main || (git pull --rebase --autostash origin main && git push origin HEAD:main)

