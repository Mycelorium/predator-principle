name: Syndicate to social channels

# Posts new essays to Bluesky, Mastodon, Telegram and Discord.
#
# Every channel is optional: a channel whose secret is missing is skipped, and the
# run still succeeds. To switch one on, add its secret under
# Settings -> Secrets and variables -> Actions. Nothing else is needed.
#
#   BSKY_HANDLE / BSKY_APP_PASSWORD
#   MASTODON_INSTANCE / MASTODON_TOKEN
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#   DISCORD_WEBHOOK_URL
#
# Runs daily even though essays are weekly: the check is free — with nothing new
# the script prints "up to date" and exits — and it means anything published off
# the weekly schedule goes out within a day rather than waiting up to seven.
# Wayback archiving used to hang off this workflow and ran daily with it, which
# was six pointless passes a week against a rate-limited endpoint. It now lives
# in archive.yml and runs weekly.

on:
  workflow_dispatch:
  schedule:
    - cron: '45 7 * * *'

permissions:
  contents: write

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post new items to the social channels
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/syndicate.mjs

      - name: Commit ledger
        run: |
          # Rebase before staging: another workflow may have pushed meanwhile, and
          # staging first leaves an empty index after an autostash rebase.
          git pull --rebase --autostash origin main || true
          git add content/syndication-state.json
          if git diff --cached --quiet; then
            echo "Nothing new to record."
          else
            git config user.name "Nirodha Collective"
            git config user.email "285060945+Mycelorium@users.noreply.github.com"
            git commit -m "chore: update syndication ledger"
            git push || {
              echo "Push rejected; rebasing once and retrying."
              git pull --rebase --autostash origin main
              git push
            }
          fi
