name: Syndicate to social channels

# Posts new dispatches and essays to Bluesky, Mastodon, Telegram and Discord, and
# asks the Internet Archive for a permanent snapshot of every page.
#
# Every channel is optional: a channel whose secret is missing is skipped, and the
# run still succeeds. To switch one on, add its secret under
# Settings -> Secrets and variables -> Actions. Nothing else is needed.
#
#   BSKY_HANDLE / BSKY_APP_PASSWORD
#   MASTODON_INSTANCE / MASTODON_TOKEN
#   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
#   DISCORD_WEBHOOK_URL
#   IA_ACCESS_KEY / IA_SECRET_KEY        (optional, makes archiving reliable)

on:
  workflow_dispatch:
  schedule:
    # daily, after the autopilot has published
    - cron: '45 7 * * *'

permissions:
  contents: write

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post new items to the social channels
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/syndicate.mjs

      - name: Archive pages in the Wayback Machine
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
        run: node scripts/archive-urls.mjs

      - name: Commit ledgers
        run: |
          if [[ -n "$(git status --porcelain content/)" ]]; then
            git config user.name "Nirodha Collective"
            git config user.email "285060945+Mycelorium@users.noreply.github.com"
            git add content/syndication-state.json content/archive-state.json 2>/dev/null || true
            git commit -m "chore: update syndication and archive ledgers"
            git push
          else
            echo "Nothing new to record."
          fi
