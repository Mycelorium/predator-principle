name: Normalise the site host to lower case

# One-shot maintenance job. Run it once, then it deletes itself.
#
# The site was generated with `Mycelorium.github.io` (capital M) in every canonical
# link, og:url, JSON-LD block, feed, sitemap and syndicated post, while the essays'
# body links used the lower-case form that GitHub Pages actually serves. Host names
# are case-insensitive, so nothing was broken — but the declared canonical URL was
# not the served one, which splits referrer and search statistics.
#
# The reason this is a workflow and not a hand edit: the three ledgers in content/
# key their entries on the generated URL. Lower-casing the host anywhere without
# lower-casing it in the ledgers too makes every essay look unseen, and the next
# syndication run reposts the whole corpus to Bluesky, Mastodon and Nostr. The
# guards below refuse to commit unless every ledger key still matches a feed id.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  normalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rewrite the host and rebuild the generated files
        run: |
          set -euo pipefail
          OLD='Mycelorium.github.io'
          NEW='mycelorium.github.io'

          before_ghcom=$(grep -ro "github\.com/Mycelorium" . --exclude-dir=.git | wc -l)
          echo "github.com/Mycelorium references before: $before_ghcom"

          # Host only. The path is case-sensitive on GitHub Pages and is never
          # touched, and github.com/Mycelorium is the repository owner, a different
          # string that must survive unchanged.
          grep -rlZ "$OLD" . --exclude-dir=.git | xargs -0 -r sed -i "s|$OLD|$NEW|g"

          node scripts/build-site.mjs

          after_capital=$(grep -ro "$OLD" . --exclude-dir=.git | wc -l || true)
          after_ghcom=$(grep -ro "github\.com/Mycelorium" . --exclude-dir=.git | wc -l)
          echo "capital host remaining: $after_capital (want 0)"
          echo "github.com/Mycelorium after: $after_ghcom (want $before_ghcom)"
          test "$after_capital" -eq 0
          test "$after_ghcom" -eq "$before_ghcom"

      - name: Refuse to commit if anything would be reposted
        run: |
          node -e '
          const fs = require("fs");
          const ids = new Set(JSON.parse(fs.readFileSync("docs/feed.json","utf8")).items.map(i => i.id || i.url));
          const synd = JSON.parse(fs.readFileSync("content/syndication-state.json","utf8"));
          let bad = 0;
          for (const ch of ["bluesky","mastodon","telegram","discord"]) {
            const miss = (synd[ch] || []).filter(u => !ids.has(u));
            console.log(ch + ": " + (synd[ch]||[]).length + " entries, " + miss.length + " orphaned");
            bad += miss.length;
          }
          const nostr = new Set(JSON.parse(fs.readFileSync("content/nostr-state.json","utf8")).posted || []);
          for (const f of ["docs/feed.json","docs/essays-feed.json"]) {
            const miss = JSON.parse(fs.readFileSync(f,"utf8")).items.map(i => i.id || i.url).filter(u => !nostr.has(u));
            console.log("nostr vs " + f + ": " + miss.length + " would post");
            bad += miss.length;
          }
          if (bad) { console.error("FAIL: " + bad + " item(s) would be reposted"); process.exit(1); }
          console.log("OK - no channel will repost");
          '

      - name: Commit, and remove this workflow
        run: |
          set -euo pipefail
          # -f is required: the rewrite above also touched this file, because the
          # search string appears in it. The file is being deleted in this very
          # commit, so discarding those modifications is exactly what we want.
          git rm -qf .github/workflows/normalise-host-case.yml
          git pull --rebase --autostash origin main || true
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to change - the host is already lower case."
          else
            git config user.name "Nirodha Collective"
            git config user.email "285060945+Mycelorium@users.noreply.github.com"
            git commit -m "site: lower-case the canonical host, ledgers included"
            git push || {
              echo "Push rejected; rebasing once and retrying."
              git pull --rebase --autostash origin main
              git push
            }
          fi
