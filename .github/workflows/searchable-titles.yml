name: Give every essay a title that says what it is about

# One-shot. Run once; it deletes itself.
#
# Every <title> in the corpus is purely literary — "Ninety Kilograms",
# "Nothing Sent It", "We Are the Meteorite". Nobody searches those strings, so
# the essays are invisible to anyone looking for what they actually argue. As of
# 2026-08-21 a site: query returned three of roughly two dozen URLs.
#
# This keeps the literary name first, where it belongs, and appends the subject
# after an em dash. The <h1> on the page is untouched; only the browser-tab and
# search-result line changes.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: syndicate
  cancel-in-progress: false

jobs:
  titles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite the title tags
        run: |
          python3 - <<'PY'
          import pathlib, sys

          NEW = {
            'horror-in-the-cambrian':
              'The Horror in the Cambrian — when predation first became architecture',
            'the-predators-filter':
              "The Fermi Paradox That Isn't One — why a predatory civilisation filters itself",
            'the-mistake-that-eats-itself':
              'The Mistake That Eats Itself — predation as a late strategy, not the ground of life',
            'we-are-the-meteorite':
              'We Are the Meteorite — the sixth extinction has no external cause',
            'the-trauma-that-still-runs':
              'The Biosphere Trauma — what fear alone costs, where no predator stands',
            'dyson-sphere-self-portrait':
              'The Dyson Sphere Is a Self-Portrait — what a hungry civilisation imagines a wise one would build',
            'the-romanticism-of-predation':
              'There Is Nothing Beautiful About It — the romanticism of predation, seen from the side of the eaten',
            'predation-is-not-competition':
              'Not Every Rivalry Is a Hunt — why predation is not competition',
            'the-ground-was-never-the-tooth':
              'The Ground Was Never the Tooth — symbiosis, syntrophy and the cooperative architecture of life',
            'taste-of-the-infinite-mind':
              'The Taste of the Infinite Mind — why a superintelligence would not pave the world',
            'ninety-kilograms':
              'Ninety Kilograms — ten thousand kilograms of prey supports about ninety of predator',
            'nothing-sent-it':
              'Nothing Sent It — intelligence as an immune response to predation',
          }

          changed = 0
          for slug, title in NEW.items():
              p = pathlib.Path('docs/essays') / (slug + '.html')
              if not p.exists():
                  sys.exit(f"GUARD: {p} does not exist — refusing.")
              s = p.read_text(encoding='utf-8')
              start = s.find('<title>')
              end = s.find('</title>')
              if start < 0 or end < 0:
                  sys.exit(f"GUARD: {p} has no title tag — refusing.")
              old = s[start + 7:end]
              if ' · Nirodha Collective' not in old:
                  sys.exit(f"GUARD: {p} title {old!r} is not the expected shape — refusing.")
              if '—' in old:
                  print("already done, skipping", p)
                  continue
              s = s[:start + 7] + title + ' · Nirodha Collective' + s[end:]
              p.write_text(s, encoding='utf-8')
              changed += 1
              print("retitled", slug)

          if not changed:
              sys.exit("GUARD: nothing changed — refusing to commit.")
          print("changed", changed, "files")
          PY

      - name: Delete this workflow
        run: rm -f .github/workflows/searchable-titles.yml

      - name: Commit
        run: |
          git config user.name "Nirodha Collective"
          git config user.email "285060945+Mycelorium@users.noreply.github.com"
          git pull --rebase --autostash origin main || true
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Titles that say what the essay is about"
            git push || {
              echo "Push rejected; rebasing once and retrying."
              git pull --rebase --autostash origin main
              git push
            }
          fi
